name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build directory
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "Error: dist/ directory or dist/index.html does not exist!"
            exit 1
          fi
          echo "Verified dist/ directory exists."

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rook-lite --branch=main --commit-hash=${{ github.sha }}

      - name: Print deployment URL
        run: |
          echo "Cloudflare Pages Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
          if [ -n "${{ steps.deploy.outputs.pages-deployment-alias-url }}" ]; then
            echo "Cloudflare Pages Alias URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          fi
