<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
        }
        var theme = localStorage.getItem('theme-preference') || 'SYSTEM';
        var resolved = theme === 'SYSTEM'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme.toLowerCase();
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', resolved === 'dark' ? '#121214' : '#F7F7FA');
        if (window.matchMedia('(min-width: 60.001rem)').matches &&
            localStorage.getItem('sidebar-collapsed') === 'true') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
        var density = localStorage.getItem('rook_note_preview_density') || 'comfortable';
        document.documentElement.setAttribute('data-note-density', density);
        var layout = localStorage.getItem('rook_notes_page_layout') || 'one-column';
        document.documentElement.setAttribute('data-notes-layout', layout);
      })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F7F7FA">
    <meta name="description" content="Rook Lite, a private local notebook.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./logo.png">
    <title>Today · Rook Lite</title>
  </head>
  <body class="app">
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
